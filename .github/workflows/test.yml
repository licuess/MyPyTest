name: MyPyTest CI Pipeline

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 设置 Python 环境
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. 安装 uv 包管理器
      - name: Install uv
        uses: astral-sh/setup-uv@v2

      # 4. 使用 uv 同步安装依赖
      - name: Install dependencies
        run: uv sync

      # 5. 运行 Pytest 并生成 Allure 测试数据
      - name: Run Pytest with Allure
        run: uv run pytest --alluredir=allure-results

      # 6. 安装 Allure CLI (生成报告前必须先装它)
      - name: Install Allure CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y default-jre
          curl -o allure.tar.gz -L https://github.com/allure-framework/allure2/releases/download/2.31.0/allure-2.31.0.tgz
          sudo mkdir -p /opt/allure
          sudo tar -zxvf allure.tar.gz -C /opt/allure --strip-components=1
          echo "/opt/allure/bin" >> $GITHUB_PATH

      # 7. 生成 Allure HTML 报告
      - name: Generate Allure Report
        if: always()
        run: |
          allure generate allure-results -o allure-report --clean

      # 8. 【关键】自动部署报告到 GitHub Pages
      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/master' # 只有 master 分支推送时才部署
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./allure-report
          force_orphan: true
