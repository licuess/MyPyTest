name: MyPyTest CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 设置 Python 环境
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. 安装 uv 包管理器
      - name: Install uv
        uses: astral-sh/setup-uv@v2

      # 4. 使用 uv 同步安装依赖
      - name: Install dependencies
        run: uv sync

      # 5. 运行 Pytest 并生成 Allure 测试数据
      - name: Run Pytest with Allure
        run: uv run pytest --alluredir=allure-results

      # 6. 将 Allure 原始数据上传为 GitHub 构建产物
      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results

      # 7.安装 Allure 命令行工具 (Linux环境)
      - name: Install Allure CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y default-jre
          curl -o allure.tar.gz -L https://github.com/allure-framework/allure2/releases/download/2.31.0/allure-2.31.0.tgz
          tar -zxvf allure.tar.gz -C /opt/
          sudo ln -s /opt/allure-2.31.0/bin/allure /usr/bin/allure

      # 8.生成 Allure HTML 报告
      - name: Generate Allure Report
        if: always()
        run: uv run allure generate allure-results -o allure-report --clean